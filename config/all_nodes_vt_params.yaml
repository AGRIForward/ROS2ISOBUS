vt_client_node:
  ros__parameters:
    # Path to PoolEdit XML. Required for VT object pool generation.
    # Can be absolute or package-share relative (resolved under share/ros2_isobus).
    xml_file: "config/vt_examples/test.xml"

    # Local and target VT source addresses.
    # - sa_local is only startup value; AddressManager status updates it at runtime.
    # - sa_vt is fallback value; VT SA is preferably detected from AddressBook NAME function 29.
    sa_local: 131
    sa_vt: 38
    # If true, start VT session only after VT is identified from AddressBook/NAME
    # (Address Claim path). If false, VT Status SA hint can start session earlier.
    vt_wait_address_claim: true

    # Fallback display profile used for XML->POOL scaling when VT response does not
    # include usable profile extension fields.
    vt_dimension: 200
    vt_softkey_width: 60
    vt_softkey_height: 32
    vt_colors: 256
    # If true, try to use VT-reported profile (when present/valid) before fallback values.
    vt_use_reported_display_profile: true
    # Optional preferred AUX assignment persistence file.
    # Format per line: <aux_input_name_hex> <aux_input_object_id_hex> <aux_function_object_id_hex>
    # If override is true, incoming AUX assignments are persisted even when
    # VT marks "do not store as preferred".
    vt_aux_preferred_store_override: false
    vt_aux_preferred_assignment_file: ""

    # IDs used as fallback when XML object IDs are missing/empty.
    # Must be non-zero valid object IDs.
    vt_working_set_id: 1
    vt_object_pool_id: 1000
    # ISO 11783-6 G.3 Working Set Maintenance byte3: WS VT version level.
    vt_working_set_version: 3
    # Optional ISO 11783-7 Working Set Member NAMEs are currently disabled.

    # Session state machine timing.
    vt_session_timeout_ms: 20000
    vt_session_retries: 3
    # Optional interoperability delay between object pool transfer (fn17)
    # and End of Object Pool (fn18). Standard does not require delay; use
    # only for VT-specific compatibility testing.
    vt_session_tick_ms: 100
