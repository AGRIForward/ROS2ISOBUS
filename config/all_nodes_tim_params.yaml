can_bridge_node:
  ros__parameters:
    interface: can0
    disable_loopback: false
    enable_tp: true
    enable_etp: true
    tp_strict_cts_timing: false
    tp_rx_timeout_ms: 1000
    tp_tx_timeout_ms: 1000
    tp_tx_window_size_default: 8
    tp_local_sa: 255

address_manager_node:
  ros__parameters:
    ecu_name_hex: "0000000000002EA0"
    preferred_address: 28

diagnostics_node:
  ros__parameters:
    source_address: 254
    priority: 6
    respond_to_requests: true
    nack_unsupported_request: true
    use_address_manager_sa: true

    periodic_dm1_enabled: true
    dm1_period_ms: 1000
    dm3_clear_dm2: true
    dm1_byte1: 255
    dm1_byte2: 255
    dm2_byte1: 255
    dm2_byte2: 255

    # B.1 ECU identification (PGN 0xFDC5), '*' delimited fields.
    ecu_part_number: "ECU-PN-UNSET"
    ecu_serial_number: "ECU-SN-UNSET"
    ecu_location: "UNSET"
    ecu_type: "TIM Client Controller"
    ecu_manufacturer_name: "Natural Resources Institute Finland (Luke)"
    ecu_hardware_id: "000533"

    # B.2 Software identification (PGN 0xFEDA): byte1=count, fields separated by '*'.
    software_ident_fields: ["ROS2ISOBUS#1.0"]

    # B.5 Diagnostic protocol identification (PGN 0xFD32), byte1.
    diagnostic_protocol_id: 0

    # B.6/B.7 DTC arrays.
    
    # B.3 ISOBUS certification (PGN 0xFD42), dynamic payload fields.
    # Disabled in the public research/simulation configuration. Enable only
    # with valid values from an actual conformance certification record.
    compliance_certification_enabled: false

    # B.9 Control function functionalities (PGN 0xFC8E).
    cf_functionality_ids: [0, 16]
    cf_functionality_generations: [1, 2]
    cf_functionality_options: ["", "0xFF,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x04,0x00,0x0B,0x00,0x02,0x0D,0x01,0x00,0x00"]

    # B.10 Product identification (PGN 0xFC8D), '*' delimited fields.
    product_ident_code: "UNSET-CODE"
    product_ident_brand: "UNSET-BRAND"
    product_ident_model: "UNSET-MODEL"

nmea2000_node:
  ros__parameters:
    frame_id: map

tecu_class2_node:
  ros__parameters: {}

tim_client_node:
  ros__parameters:
    # Public research/simulation default. None provides no TIM authentication.
    # AuthLib requires an explicit AuthLib-enabled private build and configuration.
    auth_mode: None
    # Keep authentication payload contents out of public logs. Private AuthLib
    # configurations must provide their certificate/key paths locally.
    authlib.debug_auth_payloads: false

    process_period_ms: 50
    command_mode: direct
    # Function request timeout: if no new setpoint for this duration, function enable=false.
    command_timeout_ms: 250
    implemented_version: 2
    minimum_version: 1
    tim.enable_speed: true
    tim.enable_curvature: true
    tim.enable_rear_pto: true
    tim.enable_rear_hitch: true
    # Enabled AUX valves and their control modes (1 = percent flow).
    tim.aux_fn_ids: [1, 2, 3, 4]
    tim.aux_ctrl_modes: [1, 1, 1, 1]
    tim.speed_ctrl_mode: 1
    dummy_auth.period_ms: 1000
    dummy_auth.implemented_version: 3
    dummy_auth.minimum_version: 2
    authlib.minimum_version: 2
    authlib.implemented_version: 2
